spring:
  datasource:
    url: jdbc:h2:mem:wolfbook;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wolfbook:
  upload:
    provider: local
    dir: ./target/test-uploads
  assistant:
    enabled: true
    web-search-enabled: true
    deep-seek:
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
      default-api-key:
    volcengine:
      base-url: https://ark.cn-beijing.volces.com/api/v3
      embedding-model: doubao-embedding-large-text-250515
      embedding-dimensions: 2048
      embedding-api-key:
      search-model: doubao-seed-1-6-thinking-250715
      search-api-key:
    pg-vector:
      enabled: false
