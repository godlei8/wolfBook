server:
  port: 8088
spring:
  application:
    name: wolfbook-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wolfbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:aa642353}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wolfbook:
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
      code2-session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      mock-login-enabled: ${WECHAT_MOCK_LOGIN_ENABLED:true}
  upload:
    provider: ${UPLOAD_PROVIDER:cos}
    dir: ./uploads
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:godlei-1311686380}
      region: ${COS_REGION:ap-chengdu}
      public-base-url: ${COS_PUBLIC_BASE_URL:http://cos.godlei8.top}
      prefix: ${COS_PREFIX:wolfbook}
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    history-window: ${ASSISTANT_HISTORY_WINDOW:12}
    max-sessions-per-user: ${ASSISTANT_MAX_SESSIONS:20}
    max-suggestions: ${ASSISTANT_MAX_SUGGESTIONS:3}
    similarity-threshold: ${ASSISTANT_SIMILARITY_THRESHOLD:0.45}
    top-k: ${ASSISTANT_TOP_K:4}
    temperature: ${ASSISTANT_TEMPERATURE:0.35}
    web-search-enabled: ${ASSISTANT_WEB_SEARCH_ENABLED:true}
    deep-seek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      default-api-key: ${DEEPSEEK_API_KEY:sk-a57410a815c44ff28750e5e090d9d738}
    volcengine:
      base-url: ${VOLCENGINE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      embedding-model: ${VOLCENGINE_EMBEDDING_MODEL:doubao-embedding-large-text-250515}
      embedding-dimensions: ${VOLCENGINE_EMBEDDING_DIMENSIONS:2048}
      embedding-api-key: ${VOLCENGINE_EMBEDDING_API_KEY:ark-a027dbbb-e159-4801-952e-17d9acbc435a-76d84}
      search-model: ${VOLCENGINE_SEARCH_MODEL:doubao-seed-1-6-thinking-250715}
      search-api-key: ${VOLCENGINE_SEARCH_API_KEY:K93gySpeOFFfzoQRBNkdVLRBhExdZr8T}
    pg-vector:
      enabled: ${ASSISTANT_PGVECTOR_ENABLED:false}
      url: ${ASSISTANT_PGVECTOR_URL:jdbc:postgresql://localhost:5433/wolfbook_ai}
      username: ${ASSISTANT_PGVECTOR_USERNAME:postgres}
      password: ${ASSISTANT_PGVECTOR_PASSWORD:postgres}
      table-name: ${ASSISTANT_PGVECTOR_TABLE:assistant_vector_store}
      schema-name: ${ASSISTANT_PGVECTOR_SCHEMA:public}
