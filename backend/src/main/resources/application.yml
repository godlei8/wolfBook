server:
  port: 8080
spring:
  application:
    name: wolfbook-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wolfbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:aa642353}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wolfbook:
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
      code2-session-url: ${WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  upload:
    provider: ${UPLOAD_PROVIDER:cos}
    dir: ./uploads
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:godlei-1311686380}
      region: ${COS_REGION:ap-chengdu}
      public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.godlei8.top}
      prefix: ${COS_PREFIX:wolfbook}
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    history-window: ${ASSISTANT_HISTORY_WINDOW:4}
    max-sessions-per-user: ${ASSISTANT_MAX_SESSIONS:20}
    max-suggestions: ${ASSISTANT_MAX_SUGGESTIONS:3}
    similarity-threshold: ${ASSISTANT_SIMILARITY_THRESHOLD:0.55}
    top-k: ${ASSISTANT_TOP_K:3}
    temperature: ${ASSISTANT_TEMPERATURE:0.25}
    web-search-enabled: ${ASSISTANT_WEB_SEARCH_ENABLED:false}
    web-search-timeout-seconds: ${ASSISTANT_WEB_SEARCH_TIMEOUT_SECONDS:4}
    embedding-provider: ${ASSISTANT_EMBEDDING_PROVIDER:ollama}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat}
      chat-model: ${MINIMAX_CHAT_MODEL:MiniMax-M2.7-highspeed}
      embedding-model: ${MINIMAX_EMBEDDING_MODEL:embo-01}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    pgvector:
      enabled: ${ASSISTANT_PGVECTOR_ENABLED:false}
      url: ${ASSISTANT_PGVECTOR_URL:}
      username: ${ASSISTANT_PGVECTOR_USERNAME:}
      password: ${ASSISTANT_PGVECTOR_PASSWORD:}
      table-name: ${ASSISTANT_PGVECTOR_TABLE:assistant_vector_store}
  community:
    feed-hot-candidate-limit: ${COMMUNITY_FEED_HOT_CANDIDATE_LIMIT:80}
    related-post-limit: ${COMMUNITY_RELATED_POST_LIMIT:4}
    hot:
      view-weight: ${COMMUNITY_VIEW_WEIGHT:0.2}
      like-weight: ${COMMUNITY_LIKE_WEIGHT:1.0}
      comment-weight: ${COMMUNITY_COMMENT_WEIGHT:2.0}
      favorite-weight: ${COMMUNITY_FAVORITE_WEIGHT:2.5}
      featured-bonus: ${COMMUNITY_FEATURED_BONUS:18.0}
      pinned-bonus: ${COMMUNITY_PINNED_BONUS:28.0}
      quality-weight: ${COMMUNITY_QUALITY_WEIGHT:0.1}
      age-decay-per-hour: ${COMMUNITY_AGE_DECAY_PER_HOUR:0.08}
    meilisearch:
      enabled: ${COMMUNITY_MEILI_ENABLED:true}
      base-url: ${COMMUNITY_MEILI_BASE_URL:http://127.0.0.1:7700}
      api-key: ${COMMUNITY_MEILI_API_KEY:}
      index-name: ${COMMUNITY_MEILI_INDEX:community_posts}
