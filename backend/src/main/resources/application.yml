server:
  port: 8080
spring:
  application:
    name: wolfbook-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wolfbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:aa642353}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wolfbook:
  upload:
    provider: ${UPLOAD_PROVIDER:cos}
    dir: ./uploads
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:godlei-1311686380}
      region: ${COS_REGION:ap-chengdu}
      public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.godlei8.top}
      prefix: ${COS_PREFIX:wolfbook}
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    history-window: ${ASSISTANT_HISTORY_WINDOW:12}
    max-sessions-per-user: ${ASSISTANT_MAX_SESSIONS:20}
    max-suggestions: ${ASSISTANT_MAX_SUGGESTIONS:3}
    similarity-threshold: ${ASSISTANT_SIMILARITY_THRESHOLD:0.45}
    top-k: ${ASSISTANT_TOP_K:4}
    temperature: ${ASSISTANT_TEMPERATURE:0.35}
    web-search-enabled: ${ASSISTANT_WEB_SEARCH_ENABLED:true}
    web-search-timeout-seconds: ${ASSISTANT_WEB_SEARCH_TIMEOUT_SECONDS:12}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      base-url: ${MINIMAX_BASE_URL:https://api.minimax.io}
      chat-model: ${MINIMAX_CHAT_MODEL:MiniMax-M2.7}
      embedding-model: ${MINIMAX_EMBEDDING_MODEL:text-embedding-3-small}
    pgvector:
      enabled: ${ASSISTANT_PGVECTOR_ENABLED:false}
      url: ${ASSISTANT_PGVECTOR_URL:}
      username: ${ASSISTANT_PGVECTOR_USERNAME:}
      password: ${ASSISTANT_PGVECTOR_PASSWORD:}
      table-name: ${ASSISTANT_PGVECTOR_TABLE:assistant_vector_store}
