version: "3.9"

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: wolfbook-gateway
    restart: unless-stopped
    depends_on:
      - admin
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/wolfbook.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - wolfbook

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: wolfbook-admin
    restart: unless-stopped
    expose:
      - "6110"
    networks:
      - wolfbook

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wolfbook-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8110"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USERNAME}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-https://wolfbook.godlei8.top}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: ${COS_BUCKET}
      COS_REGION: ${COS_REGION}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL}
      COS_PREFIX: ${COS_PREFIX:-wolfbook}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io}
      MINIMAX_CHAT_MODEL: ${MINIMAX_CHAT_MODEL:-MiniMax-M2.7}
      MINIMAX_EMBEDDING_MODEL: ${MINIMAX_EMBEDDING_MODEL:-text-embedding-3-small}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET}
      WECHAT_CODE2SESSION_URL: ${WECHAT_CODE2SESSION_URL:-https://api.weixin.qq.com/sns/jscode2session}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
      ASSISTANT_WEB_SEARCH_ENABLED: ${ASSISTANT_WEB_SEARCH_ENABLED:-true}
      ASSISTANT_PGVECTOR_ENABLED: ${ASSISTANT_PGVECTOR_ENABLED:-true}
      ASSISTANT_PGVECTOR_URL: jdbc:postgresql://postgres:5432/${PGVECTOR_DATABASE}
      ASSISTANT_PGVECTOR_USERNAME: ${PGVECTOR_USERNAME}
      ASSISTANT_PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      ASSISTANT_PGVECTOR_TABLE: ${ASSISTANT_PGVECTOR_TABLE:-assistant_vector_store}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - wolfbook

  mysql:
    image: mysql:8.4
    container_name: wolfbook-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wolfbook

  postgres:
    image: pgvector/pgvector:pg16
    container_name: wolfbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE}
      POSTGRES_USER: ${PGVECTOR_USERNAME}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - wolfbook

networks:
  wolfbook:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
